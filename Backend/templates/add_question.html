{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-{{ 'primary' if is_edit else 'success' }}">
            <div class="card-header bg-{{ 'primary' if is_edit else 'success' }} text-white">
                <h4 class="mb-0">{{ 'Edit Challenge Question' if is_edit else 'Add New Challenge Question' }}</h4>
            </div>
            <div class="card-body">
                {{ render_form(form) }}
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('developer_dashboard') }}" class="text-decoration-none text-muted">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
